<!DOCTYPE html> <!--Tells the browser to use html-->
<html lang="en"> <!--Tells the browser this is English-->

<!--Header holds basic info for presenting the web page when loaded.-->
<head>
  <meta charset="UTF-8"> <!--Tells what character set is being used-->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!--Tells what device is being used and to change the screen size accordingly-->
  <title>Course Information</title> <!--Title of the site-->
</head>

<!--The body is where the actual content traditionally lives-->
<body>
  <main> <!--The main content and where everything is processed-->
    <h1>Course Information</h1> <!--h1 is Header 1, and is the biggest size-->
    <p>Username: your_username</p> <!--is Paragraph and is normal text-->
    <p>Course name: Introduction to Web Development</p>
    <p>Course number: CIS 101</p>
    <p>Section: 001</p>
  </main>
  
  <!--The footer is where any additional info goes and is usually just contact information-->
  <footer>
    <p>&copy; Your Name - Due date: October 12, 2026</p>
  </footer>
</body>
</html>
